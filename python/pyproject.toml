
[build-system]
requires = ["setuptools>=40.8.0", "wheel", "cmake>=3.18", "ninja>=1.11.1", "pybind11>=2.13.1"]

# We're incrementally switching from autopep8 to ruff.
[tool.autopep8]
aggressive = 1
ignore = "E501,E701,E731,W690,W503"
max_line_length = 88

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E701", "E731", "E741"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "pybind11>=3.0.4",
    "ruff>=0.15.12",
    "setuptools>=82.0.1",
    "typer>=0.26.2",
]
